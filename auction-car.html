<style>
  :root {
    --red:#E60012; --red-dark:#B3000E; --gold:#C8A23C;

  * { margin:0; padding:0; box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }

  nav { background:rgba(255,255,255,0.96); backdrop-filter:blur(10px); border-bottom:1px solid var(--border); height:60px; display:flex; align-items:center; justify-content:space-between; padding:0 20px; position:sticky; top:0; z-index:40; }

  .logo-mark { width:36px; height:36px; background:var(--red); clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%); display:flex; align-items:center; justify-content:center; font-family:'Bebas Neue',sans-serif; font-size:15px; color:#fff; }

  .nav-back { font-size:13px; color:var(--muted); }

  .wrap { max-width:1100px; margin:0 auto; padding:24px 20px 60px; }

  .live-badge { display:inline-flex; align-items:center; gap:8px; background:rgba(230,0,18,0.08); border:1px solid rgba(230,0,18,0.2); color:var(--red); font-size:11px; font-weight:700; letter-spacing:2px; text-transform:uppercase; padding:6px 14px; border-radius:6px; margin-bottom:16px; font-family:'Rajdhani',sans-serif; }
  .live-dot { width:7px; height:7px; border-radius:50%; background:var(--red); animation:pulse 1.2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
  .live-badge.closed { background:var(--bg-alt); border-color:var(--border); color:var(--muted); }
  .live-badge.closed .live-dot { background:var(--muted); animation:none; }

  /* LAYOUT: minmax(0,…) and min-width:0 stop wide content (photo thumbnails) from stretching the columns */
  .grid { display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:28px; align-items:start; }

  /* GALLERY: the photo is absolutely placed inside a fixed-ratio box, so its size can never follow the file size */
  .gallery { background:#fff; border:1px solid var(--border); border-radius:14px; overflow:hidden; box-shadow:var(--shadow); max-width:100%; }
  .gallery-main { position:relative; width:100%; aspect-ratio:16/11; max-height:520px; background:#ECEDF0; overflow:hidden; }

  .gnav { position:absolute; top:50%; transform:translateY(-50%); width:40px; height:40px; background:rgba(255,255,255,0.9); border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; user-select:none; border:none; font-size:22px; line-height:1; z-index:2; }
  .gnav.prev { left:12px; } .gnav.next { right:12px; }
  .gnav:hover { background:#fff; }
  .gcount { position:absolute; bottom:12px; right:12px; background:rgba(17,24,39,0.8); color:#fff; font-size:11px; font-weight:600; padding:4px 10px; border-radius:6px; font-family:'JetBrains Mono',monospace; z-index:2; }

  .gnav { width:44px; height:44px; }

// Fetch every page in a stable order. Never turn a failed read into an empty list.
async function readAll(buildQuery){
  const rows = [];
  for(let offset=0;;){
    const {data, error} = await buildQuery().range(offset, offset+499);
    if(error) throw error;
    if(!Array.isArray(data)) throw new Error('Unexpected database response.');
    if(!data.length) return rows;
    rows.push(...data);
    offset += data.length;
  }
}

function kgVisitor(){
  try { let v = localStorage.getItem('kgVisitor'); if(!v){ v = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now()+'-'+Math.random().toString(36).slice(2)); localStorage.setItem('kgVisitor', v); } return v; }
  catch(e){ return 'anon'; }
}
function kgTrack(event, auctionId){
  if(navigator.webdriver || /bot|crawl|spider|slurp|facebookexternalhit|preview/i.test(navigator.userAgent)) return;
  try { if(window.gtag) gtag('event','auction_'+event,{auction_id:auctionId||''}); } catch(e){}
  try {
    let ref = 'direct'; try { if(document.referrer) ref = new URL(document.referrer).hostname; } catch(e){}
    sb.from('auction_events').insert({ event:event, auction_id:auctionId||null, visitor_id:kgVisitor(),
      device:/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)?'mobile':'desktop', referrer:ref.slice(0,100), path:location.pathname }).then(function(){},function(){});
  } catch(e){}
}

}
async function refreshAuction(){
  if(refreshPromise) return refreshPromise;
  refreshPromise = (async()=>{
    try {
      const id = getAuctionId();
      if(!id) throw new Error('No listing specified.');
      const [result, nextBids] = await Promise.all([
        sb.from('auctions').select('*').eq('id',id).single(),
        readAll(()=>sb.from('public_bids').select('*').eq('auction_id',id).order('amount',{ascending:false}).order('id'))
      ]);
      if(result.error || !result.data) throw result.error || new Error('Listing not found.');
      const changed = !auction || JSON.stringify(auction)!==JSON.stringify(result.data);
      auction = result.data;
      bids = nextBids;
      photos = (auction.photos||[]).map(p=>p && p.url).filter(Boolean);
      if(!photos.length) photos = ['https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?w=800'];
      connectionState(true);
      const closed = isClosed();
      if(changed || endedState!==closed){
        endedState = closed;
        renderPage();
        startTimer();
      } else refreshLiveBits();
      return true;
    } catch(error){
      console.error('Listing refresh failed',error);
      connectionState(false);
      if(!auction) setLoading('Could not load this listing. Check the link and connection. Retrying automatically…');
      return false;
    }
  })();
  try { return await refreshPromise; } finally { refreshPromise=null; }
}
async function loadAuction(){

    document.addEventListener('visibilitychange',()=>{ if(!document.hidden) refreshAuction(); });
  }
}
async function loadBids(){

  let t = Number(auction.duty_est||0) + Number(auction.ap_est||0);

}
function landedTotal(bid){ return Number(bid||0) + extrasTotal(); }

}

// Split the description into an intro and a bullet list (text is split on the "•" character)
function parseDetails(raw){
  const text = String(raw||'').replace(/\r/g,'').trim();
  if(!text) return null;
  let intro = text, items = [], title = 'Highlights';
  if(text.indexOf('•') > -1){
    const parts = text.split('•').map(x=>x.trim()).filter(Boolean);
    intro = text.charAt(0)==='•' ? '' : parts.shift();
    items = parts;
    const m = intro.match(/\b([A-Z][A-Z &\/]{3,}?(?:HIGHLIGHTS|FEATURES|SPECIFICATIONS?|EQUIPMENT))\s*:?\s*$/);
    if(m){ title = m[1].toLowerCase().replace(/(^|\s)\S/g,c=>c.toUpperCase()); intro = intro.slice(0,m.index).trim(); }
  }
  return { intro, items, title };
}
function introHtml(t){
  return t.replace(/\s+(Exterior|Interior|Mileage|Colour|Color|Engine|Transmission|Drive|Chassis)\s*:/g,'\n$1:')
    .split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
      const m = l.match(/^([A-Za-z ]{3,14}):\s*(.*)$/);
      return m ? `<div class="d-line"><strong>${esc(m[1])}:</strong> ${esc(m[2])}</div>` : `<div class="d-line">${esc(l)}</div>`;
    }).join('');
}

let stickyObs = null;
function setupSticky(closed){
  if(stickyObs){ stickyObs.disconnect(); stickyObs=null; }
  const btn = document.getElementById('bidBtn'), bar = document.getElementById('stickyBar');
  if(closed || !btn || !bar || !('IntersectionObserver' in window)) return;
  stickyObs = new IntersectionObserver(es=>{ bar.classList.toggle('hide', es[0].isIntersecting); }, {threshold:0.5});
  stickyObs.observe(btn);
}

function startTimer(){

    const d=Math.floor(diff/86400000),h=Math.floor(diff/3600000)%24,m=Math.floor(diff/60000)%60,sec=Math.floor(diff/1000)%60;
    const seg=(n,l)=>`<div class="timer-seg"><div class="timer-num">${String(n).padStart(2,'0')}</div><div class="timer-lbl">${l}</div></div>`;

  }
  timerInterval=setInterval(tick,1000);

}

// ── OFFER FLOW ──────────────────────────────────────────────────────────────
// 1. The visitor enters an amount, their name and WhatsApp number, and taps Send.
// 2. The offer is saved as UNVERIFIED (rpc submit_offer). Staff see it at once in the
//    Auction Manager; it is not shown publicly until staff approve that bidder.
// 3. WhatsApp opens with the offer prepared for our sales number. The visitor taps Send.
// Approved bidders can still enter their bidder code: their offers go live at once (rpc place_bid).
//
// Until submit_offer is deployed (PostgREST answers PGRST202), the registration is saved with
// register_bidder and the offer itself reaches staff on WhatsApp. No offer is ever lost.

// "+60 12-345 6789" / "012 345 6789" / "0060..." → "60123456789"; null when the country is unclear.
function normPhone(v){
  let p = String(v||'').normalize('NFKC').replace(/\(0\)/g,'');
  const plus = p.trim().startsWith('+');
  const d = p.replace(/\D/g,'');
  if(!d) return null;
  let out;
  if(plus) out = d;
  else if(d.startsWith('00')) out = d.slice(2);
  else if(d.startsWith('60')) out = d;
  else if(d.startsWith('0')) out = '60'+d.slice(1);
  else if(d.startsWith('1') && d.length>=9 && d.length<=10) out = '60'+d;
  else return null;
  return (out.length>=9 && out.length<=15) ? out : null;
}
function showPhone(d){
  if(/^60\d{8,10}$/.test(d)){ const r = d.slice(2); return '+60 '+r.slice(0,2)+'-'+r.slice(2,r.length-4)+' '+r.slice(-4); }
  return '+'+d;
}
function makeRef(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', buf = new Uint32Array(6);
  (window.crypto||window.msCrypto).getRandomValues(buf);
  return 'KG-'+Array.from(buf, n=>chars[n%chars.length]).join('');
}

function nextMinimumOffer(){ return Math.ceil((currentPrice()+MIN_INCREMENT)/MIN_INCREMENT)*MIN_INCREMENT; }
function validOfferAmount(amount){
  return Number.isSafeInteger(amount) && amount>0 && amount<=100000000 && amount%MIN_INCREMENT===0 && amount>=nextMinimumOffer();
}

    <p class="modal-sub">We send your code on WhatsApp after you are verified. With a code, your offers go live straight away.</p>
    <div class="modal-field"><label for="codeIn">Bidder code</label><input type="text" id="codeIn" class="code-in" placeholder="XXXX-XXXX" maxlength="9" autocomplete="off" autocapitalize="characters" spellcheck="false" onkeydown="if(event.key==='Enter')submitCode()"></div>
    <div class="modal-error" id="modalError" role="alert"></div>
    <button type="button" class="modal-submit full" id="codeBtn" onclick="submitCode()">Verify code</button>
    <div class="alt-row"><button type="button" class="link-btn" onclick="showOfferForm()">No code? Make an offer with your name and number</button></div>`;
}

function offerMessage(o, ref){
  const lines = ['Hi Kansai Group, I would like to make an offer.', '',
    'Vehicle: '+carTitle(), 'My offer: RM '+rm(o.amount), 'Name: '+o.name, 'WhatsApp: '+showPhone(o.phone)];
  if(ref) lines.push('Reference: '+ref);
  lines.push('Listing: '+pageUrl(), 'Agreed to Auction Terms '+TERMS_VERSION, '', 'Please verify me and let me know the refundable deposit details.');
  return lines.join('\n');
}

function successHTML(o, res, opened){
  const url = waHref(offerMessage(o, res.ref));
  const saved = res.mode==='saved';
  const already = res.status==='approved';
  const lead = saved
    ? (opened ? 'Your offer is saved. WhatsApp has opened with the details: tap <strong>Send</strong> there so our team can verify you.' : 'Your offer is saved. Now send it to us on WhatsApp so our team can verify you.')
    : (opened ? 'WhatsApp has opened with your offer. Tap <strong>Send</strong> there: that is how your offer reaches our team.' : 'One more tap: send your offer to us on WhatsApp. That is how it reaches our team.');
  return `
    ${headHTML(saved ? 'Offer received' : 'Almost done')}
    <div class="offer-done">
      <div class="check" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></div>
      <div class="od-amt bebas"><small>RM</small> ${rm(o.amount)}</div>
      <div class="od-car">${esc(carTitle())}</div>
      ${res.ref?`<div class="od-ref">Reference <strong>${esc(res.ref)}</strong></div>`:''}
    </div>
    <p class="od-lead">${lead}</p>
    <a class="wa-btn" target="_blank" rel="noopener" href="${url}" onclick="kgTrack('whatsapp',auction.id)">${opened?'Open WhatsApp again':'Send on WhatsApp'}</a>
    ${stepsHTML(1)}
    <p class="modal-consent">${already ? 'You are already verified. Enter your bidder code next time and your offers go live straight away.' : 'Your offer shows publicly once we verify you and confirm your refundable deposit. We will contact you on WhatsApp if your offer is accepted.'}</p>
    <button type="button" class="modal-cancel full" onclick="closeModalAndRefresh()">Done</button>`;
}

function liveSuccessHTML(amount){
  const msg = ['Hi Kansai Group, I placed an offer with my bidder code.','','Vehicle: '+carTitle(),'My offer: RM '+rm(amount),'Listing: '+pageUrl()].join('\n');
  return `
    ${headHTML('Offer placed')}
    <div class="offer-done">
      <div class="check" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></div>
      <div class="od-amt bebas"><small>RM</small> ${rm(amount)}</div>
      <div class="od-car">${esc(carTitle())}</div>
    </div>
    <p class="od-lead">Your offer is live on this page. It is subject to acceptance by Kansai Group. We will contact you on WhatsApp if we accept it.</p>
    <a class="wa-btn ghost" target="_blank" rel="noopener" href="${waHref(msg)}" onclick="kgTrack('whatsapp',auction.id)">Message us on WhatsApp</a>
    <button type="button" class="modal-cancel full" onclick="closeModalAndRefresh()">Done</button>`;
}

function blockedHTML(){
  return `${headHTML('We could not take this offer')}
    <p class="modal-sub">This number cannot submit offers online. Please contact our team on WhatsApp.</p>
    <a class="wa-btn" target="_blank" rel="noopener" href="${waHref('Hi Kansai Group, I could not submit an offer for '+carTitle()+' ('+pageUrl()+').')}">Contact us on WhatsApp</a>
    <button type="button" class="modal-cancel full" onclick="closeModal()">Close</button>`;
}

function focusFirst(){
  const el = document.querySelector('#modalInner input:not([type=checkbox])');
  if(el && window.matchMedia('(hover:hover)').matches) el.focus();
}
function showOfferForm(prevAmount){
  if(formMode==='code' && !bidderInfo) formMode = 'offer';
  setModal(offerFormHTML(prevAmount));
  onAmountEdit(); focusFirst();
}
function showCodeScreen(){ setModal(codeHTML()); focusFirst(); }
function notYou(){ forgetBidder(); showOfferForm(); }
function changeIdentity(){
  const a = amountVal();
  editIdentity = true; showOfferForm(a||undefined);
}
function fieldOk(id){ const e=document.getElementById(id+'Err'); if(e){ e.textContent=''; e.classList.remove('show'); } const i=document.getElementById(id); if(i) i.removeAttribute('aria-invalid'); clearErr(); }
function fieldBad(id,msg){ const e=document.getElementById(id+'Err'); if(e){ e.textContent=msg; e.classList.add('show'); } const i=document.getElementById(id); if(i){ i.setAttribute('aria-invalid','true'); } }

async function verifyCode(code){
  try {
    const {data,error} = await sb.rpc('verify_bidder',{p_code:code});
    if(error || !data) return {ok:false,error:true};
    return data;
  } catch(error){ return {ok:false,error:true}; }
}

async function openModal(){
  if(!(await refreshAuction()) || isClosed()) return;
  kgTrack('bid_open', auction.id);
  document.getElementById('bidModal').classList.add('open');
  document.body.classList.add('modal-open');
  editIdentity = false;
  if(!bidderCode){ formMode='offer'; showOfferForm(); return; }
  // Recheck a saved code every time: staff may have removed or blocked the bidder since.
  setModal('<div class="loading" style="padding:40px 10px">Checking your bidder code…</div>');
  const r = await verifyCode(bidderCode);
  if(!r.error && r.ok && r.can_bid){ bidderInfo = r; formMode='code'; showOfferForm(); return; }
  if(!r.error){ bidderCode=null; bidderInfo=null; try{ localStorage.removeItem(CODE_KEY); }catch(e){} }
  formMode='offer'; showOfferForm();
}

async function submitCode(){
  const code = document.getElementById('codeIn').value.trim().toUpperCase();
  if(code.length < 8){ modalErr('Please enter your full bidder code.'); return; }
  const btn = document.getElementById('codeBtn'); btn.textContent='Checking…'; btn.disabled=true;
  const r = await verifyCode(code);
  btn.textContent='Verify code'; btn.disabled=false;
  if(r.error){ modalErr('Could not check the code. Please check your connection and try again.'); return; }
  if(!r.ok){ modalErr('That code was not recognised. Check it and try again, or make an offer with your name and number.'); return; }
  if(!r.can_bid){
    modalErr(r.status==='blocked' ? 'This bidder code is not active. Please contact us on WhatsApp.' : 'This code is not active yet. Make an offer with your name and number and we will verify you on WhatsApp.');
    return;
  }
  bidderCode = code; bidderInfo = r; formMode='code';
  try { localStorage.setItem(CODE_KEY, code); } catch(e){}
  showOfferForm();
}

function amountVal(){ const i = document.getElementById('bidAmount'); return i ? Number(String(i.value).replace(/[^0-9]/g,'')) : 0; }
function onAmountInput(el){
  const n = String(el.value).replace(/[^0-9]/g,'').slice(0,9);
  el.value = n ? Number(n).toLocaleString('en-MY') : '';
  onAmountEdit();
}
function bumpTo(inc){
  const input = document.getElementById('bidAmount');
  const current = amountVal();
  const base = validOfferAmount(current) ? current : nextMinimumOffer()-MIN_INCREMENT;
  input.value = rm(base+inc);
  onAmountEdit();
}
function onAmountEdit(){
  const input = document.getElementById('bidAmount'); if(!input) return;
  const minimum = nextMinimumOffer(), amount = amountVal();
  const valid = validOfferAmount(amount);
  const hint = document.getElementById('bidHint');
  hint.textContent = valid ? `Minimum RM ${rm(minimum)} · in steps of RM ${rm(MIN_INCREMENT)}` : `Enter RM ${rm(minimum)} or more, in steps of RM ${rm(MIN_INCREMENT)}.`;
  hint.classList.toggle('bad', !valid && input.value!=='');
  input.toggleAttribute('aria-invalid', !valid && input.value!=='');
  const oc = document.getElementById('ocPrice'); if(oc) oc.textContent = 'RM '+rm(currentPrice());
  const button = document.getElementById('submitBidBtn');
  if(button && !submittingBid){
    button.disabled = !valid || !dataFresh || isClosed();
    button.textContent = isClosed() ? 'Listing closed' : !dataFresh ? 'Reconnecting…' : valid ? `Send offer · RM ${rm(amount)}` : 'Send offer';
  }
}

// Open the WhatsApp tab during the tap itself, so phone browsers do not block it.
function openPending(){
  let w = null;
  try { w = window.open('', '_blank'); if(w){ w.document.title='Opening WhatsApp…'; w.document.body.innerHTML='<p style="font-family:sans-serif;padding:24px;color:#444">Opening WhatsApp…</p>'; } } catch(e){ w = null; }
  return w;
}
function routePopup(w,url){ if(w && !w.closed){ try { w.opener=null; w.location.href=url; return true; } catch(e){} } return false; }
function closePopup(w){ try { if(w && !w.closed) w.close(); } catch(e){} }
function userError(message){ const e = new Error(message); e.userFacing = true; return e; }

async function sendOffer(o){
  const res = await sb.rpc('submit_offer',{p_auction:auction.id, p_amount:o.amount, p_name:o.name, p_phone:o.phone, p_terms:TERMS_VERSION});
  if(!res.error){
    const d = res.data;
    if(!d || d.ok!==true) throw new Error('No offer confirmation received.');
    return {mode:'saved', ref:d.reference||null, status:d.bidder_status||'pending', verified:d.verified===true};
  }
  if(res.error.code==='P0001') throw userError(res.error.message);
  if(res.error.code!=='PGRST202') throw res.error;
  // submit_offer is not deployed yet: save the registration; the offer travels on WhatsApp.
  const r = await sb.rpc('register_bidder',{p_name:o.name, p_phone:o.phone, p_terms:LEGACY_TERMS_VERSION, p_auction:auction.id});
  if(r.error){ if(r.error.code==='P0001') throw userError(r.error.message); throw r.error; }
  const st = (r.data && r.data.status) || 'pending';
  if(st==='blocked'){ const e = userError('blocked'); e.blocked = true; throw e; }
  return {mode:'whatsapp', ref:(r.data && r.data.registration_ref) || makeRef(), status:st, verified:false};
}

async function submitOffer(){
  if(submittingBid) return;
  clearErr();
  const amount = amountVal();
  const me = offerer();
  const nameEl = document.getElementById('regName'), phoneEl = document.getElementById('regPhone');
  const name = nameEl ? nameEl.value.trim().replace(/\s+/g,' ') : me.name;
  const phone = phoneEl ? normPhone(phoneEl.value) : me.phone;
  let bad = false;
  if(!validOfferAmount(amount)){ onAmountEdit(); modalErr(`Enter RM ${rm(nextMinimumOffer())} or more, in steps of RM ${rm(MIN_INCREMENT)}.`); bad = true; }
  if(nameEl && name.length < 2){ fieldBad('regName','Enter your name.'); bad = true; }
  if(phoneEl && !phoneEl.value.trim()){ fieldBad('regPhone','Enter your WhatsApp number.'); bad = true; }
  else if(phoneEl && !phone){ fieldBad('regPhone','Check the number. Outside Malaysia, start with + and the country code.'); bad = true; }
  const agree = document.getElementById('regAgree');
  if(!bad && agree && !agree.checked){ modalErr('Please tick the box to agree to the Auction Terms and Privacy Notice.'); bad = true; }
  if(bad){ const first = document.querySelector('#modalInner [aria-invalid="true"]'); if(first) first.focus(); return; }

  const o = {amount, name, phone};
  const btn = document.getElementById('submitBidBtn');
  submittingBid = true; btn.disabled = true; btn.textContent = 'Sending…';
  const popup = openPending();
  try {
    if(!(await refreshAuction())) throw userError('Could not check the latest price. Please check your connection and try again.');
    if(isClosed()) throw userError('This listing has just closed to new offers.');
    if(!validOfferAmount(amount)) throw userError(`Another offer just came in. The minimum is now RM ${rm(nextMinimumOffer())}.`);
    const res = await sendOffer(o);
    writeStore(OFFERER_KEY, {name, phone, terms:TERMS_VERSION});
    saveMyOffer({amount, ref:res.ref, at:new Date().toISOString(), saved:res.mode==='saved', verified:res.verified});
    editIdentity = false;
    kgTrack(res.mode==='saved' ? 'bid_submit' : 'register_submit', auction.id);
    const opened = routePopup(popup, waHref(offerMessage(o, res.ref)));
    if(opened) kgTrack('whatsapp', auction.id);
    setModal(successHTML(o, res, opened));
    renderBidStatus();
  } catch(error){
    closePopup(popup);
    if(error.blocked){ setModal(blockedHTML()); return; }
    console.error(error);
    if(error.userFacing){ modalErr(error.message); }
    else modalErr('We could not save your offer right now.', waHref(offerMessage(o, null)));
    refreshAuction();
  } finally {
    submittingBid = false;
    if(btn.isConnected) onAmountEdit();
  }
}

// Approved bidder with a code: the offer goes live at once.
async function submitBid(){
  if(submittingBid) return;
  clearErr();
  const amount = amountVal();
  if(!validOfferAmount(amount)){ onAmountEdit(); modalErr(`Enter RM ${rm(nextMinimumOffer())} or more, in steps of RM ${rm(MIN_INCREMENT)}.`); return; }
  const btn = document.getElementById('submitBidBtn');
  submittingBid = true; btn.textContent = 'Sending…'; btn.disabled = true;
  try {
    if(!(await refreshAuction())){ modalErr('Could not check the latest price. Please check your connection and try again.'); return; }
    if(isClosed()){ modalErr('This listing has just closed to new offers.'); return; }
    if(!validOfferAmount(amount)){ modalErr(`Another offer just came in. The minimum is now RM ${rm(nextMinimumOffer())}.`); return; }
    const {data,error} = await sb.rpc('place_bid',{p_auction:auction.id, p_amount:amount, p_code:bidderCode});
    if(error){
      modalErr(error.code==='P0001' ? error.message : 'We could not confirm your offer. Refresh and check the offer list before trying again.');
      await refreshAuction(); return;
    }
    if(!data || data.ok!==true) throw new Error('No offer confirmation received.');
    kgTrack('bid_submit', auction.id);
    saveMyOffer({amount, ref:null, at:new Date().toISOString(), saved:true, verified:true});
    setModal(liveSuccessHTML(amount));
    await refreshAuction();
  } catch(error){
    console.error(error);
    modalErr('We could not confirm your offer. Refresh and check the offer list before trying again.');
  } finally {
    submittingBid = false;
    if(btn.isConnected) onAmountEdit();
  }
}

async function closeModalAndRefresh(){
  closeModal();
  await refreshAuction();
}

document.getElementById('bidModal').addEventListener('click',e=>{ if(e.target.id==='bidModal') closeModal(); });

loadAuction();
</script>
