<style>
  :root {
    --red:#E60012; --red-dark:#B3000E; --gold:#C8A23C;

  * { margin:0; padding:0; box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }

  nav { background:rgba(255,255,255,0.96); backdrop-filter:blur(10px); border-bottom:1px solid var(--border); height:60px; display:flex; align-items:center; justify-content:space-between; padding:0 20px; position:sticky; top:0; z-index:40; }

  .logo-mark { width:36px; height:36px; background:var(--red); clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%); display:flex; align-items:center; justify-content:center; font-family:'Bebas Neue',sans-serif; font-size:15px; color:#fff; }

  .nav-back { font-size:13px; color:var(--muted); }

  .wrap { max-width:1100px; margin:0 auto; padding:24px 20px 60px; }

  .live-badge { display:inline-flex; align-items:center; gap:8px; background:rgba(230,0,18,0.08); border:1px solid rgba(230,0,18,0.2); color:var(--red); font-size:11px; font-weight:700; letter-spacing:2px; text-transform:uppercase; padding:6px 14px; border-radius:6px; margin-bottom:16px; font-family:'Rajdhani',sans-serif; }
  .live-dot { width:7px; height:7px; border-radius:50%; background:var(--red); animation:pulse 1.2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
  .live-badge.closed { background:var(--bg-alt); border-color:var(--border); color:var(--muted); }
  .live-badge.closed .live-dot { background:var(--muted); animation:none; }

  /* LAYOUT: minmax(0,…) and min-width:0 stop wide content (photo thumbnails) from stretching the columns */
  .grid { display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:28px; align-items:start; }

  /* GALLERY: the photo is absolutely placed inside a fixed-ratio box, so its size can never follow the file size */
  .gallery { background:#fff; border:1px solid var(--border); border-radius:14px; overflow:hidden; box-shadow:var(--shadow); max-width:100%; }
  .gallery-main { position:relative; width:100%; aspect-ratio:16/11; max-height:520px; background:#ECEDF0; overflow:hidden; }

  .gnav { position:absolute; top:50%; transform:translateY(-50%); width:40px; height:40px; background:rgba(255,255,255,0.9); border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; user-select:none; border:none; font-size:22px; line-height:1; z-index:2; }
  .gnav.prev { left:12px; } .gnav.next { right:12px; }
  .gnav:hover { background:#fff; }
  .gcount { position:absolute; bottom:12px; right:12px; background:rgba(17,24,39,0.8); color:#fff; font-size:11px; font-weight:600; padding:4px 10px; border-radius:6px; font-family:'JetBrains Mono',monospace; z-index:2; }

  .gnav { width:44px; height:44px; }

// Fetch every page in a stable order. Never turn a failed read into an empty list.
async function readAll(buildQuery){
  const rows = [];
  for(let offset=0;;){
    const {data, error} = await buildQuery().range(offset, offset+499);
    if(error) throw error;
    if(!Array.isArray(data)) throw new Error('Unexpected database response.');
    if(!data.length) return rows;
    rows.push(...data);
    offset += data.length;
  }
}

}

}

function parseDetails(raw){
  const text = String(raw||'').replace(/\r/g,'').trim();

  let intro = text, items = [], title = 'Highlights';
  if(text.indexOf('•') > -1){
    const parts = text.split('•').map(x=>x.trim()).filter(Boolean);
    intro = text.charAt(0)==='•' ? '' : parts.shift();
    items = parts;
    const m = intro.match(/\b([A-Z][A-Z &\/]{3,}?(?:HIGHLIGHTS|FEATURES|SPECIFICATIONS?|EQUIPMENT))\s*:?\s*$/);
    if(m){ title = m[1].toLowerCase().replace(/(^|\s)\S/g,c=>c.toUpperCase()); intro = intro.slice(0,m.index).trim(); }
  }
  return { intro, items, title };
}

function metaTag(key, content, isProp){
  const sel = isProp ? `meta[property="${key}"]` : `meta[name="${key}"]`;
  let el = document.head.querySelector(sel);
  if(!el){ el = document.createElement('meta'); el.setAttribute(isProp?'property':'name', key); document.head.appendChild(el); }
  el.setAttribute('content', content);
}
function updateSEO(){
  const url = pageUrl(), closed = isClosed(), price = currentPrice();

  const plain = String(auction.description||'').replace(/\s*•\s*/g,', ').replace(/\s+/g,' ').trim();

  const img = photos[0];
  document.title = title;
  metaTag('description', desc);
  metaTag('robots', closed ? 'noindex, follow' : 'index, follow');
  let can = document.head.querySelector('link[rel="canonical"]');
  if(!can){ can = document.createElement('link'); can.rel='canonical'; document.head.appendChild(can); }
  can.href = url;
  metaTag('og:title', title, true); metaTag('og:description', desc, true); metaTag('og:image', img, true); metaTag('og:url', url, true);
  metaTag('twitter:title', title); metaTag('twitter:description', desc); metaTag('twitter:image', img);
  const ld = { '@context':'https://schema.org', '@graph':[
    { '@type':'Car', '@id':url+'#car', name:nm, description:(plain||auction.specs||nm).slice(0,1000), image:photos.slice(0,6), url,
      ...(/^\d{4}$/.test(String(auction.year||'')) ? { vehicleModelDate:String(auction.year) } : {}),
      offers:{ '@type':'Offer', url, price:String(price), priceCurrency:'MYR',
        availability: closed ? 'https://schema.org/Discontinued' : 'https://schema.org/InStock',
        ...(auction.deadline ? { priceValidUntil:new Date(auction.deadline).toISOString().slice(0,10) } : {}),
        seller:{ '@type':'AutoDealer', name:'Kansai Group Malaysia', url:'https://www.kansaigroup.my' } } },
    { '@type':'BreadcrumbList', itemListElement:[
      { '@type':'ListItem', position:1, name:'Home', item:location.origin+'/' },
      { '@type':'ListItem', position:2, name:'Live Auctions', item:new URL('auctions.html', location.href).href },
      { '@type':'ListItem', position:3, name:nm, item:url } ] } ] };
  let s = document.getElementById('ld-auction');
  if(!s){ s = document.createElement('script'); s.type='application/ld+json'; s.id='ld-auction'; document.head.appendChild(s); }
  s.textContent = JSON.stringify(ld);
}

function renderFeed(){
  const list = document.getElementById('feedList');
  if(!list) return;
  if(!bids.length){ list.innerHTML = `<div class="feed-empty">No bids yet. Be the first to bid.</div>`; return; }
  const sorted = [...bids].sort((a,b)=>Number(b.amount)-Number(a.amount));
  list.innerHTML = sorted.slice(0,8).map((b,i)=>{
    const label = b.bidder_label || 'Bidder';
    return `<div class="feed-item">
      <div class="feed-bidder">
        <div class="feed-avatar">${esc(label.charAt(0).toUpperCase())}</div>
        <div>
          <div class="feed-name">${esc(label)}</div>
          <div class="feed-time">${timeAgo(b.created_at)}</div>
        </div>
      </div>
      <div class="feed-amount ${i===0?'top':''}">RM ${rm(b.amount)}</div>
    </div>`;
  }).join('');
}

function timeAgo(ts){
  const diff = Math.floor((Date.now()-new Date(ts).getTime())/1000);
  if(diff<60) return 'just now';
  if(diff<3600) return Math.floor(diff/60)+'m ago';
  if(diff<86400) return Math.floor(diff/3600)+'h ago';
  return Math.floor(diff/86400)+'d ago';
}

function refreshLiveBits(){
  if(isClosed()) return;
  const pv = document.getElementById('priceValue');
  const bc = document.getElementById('bidCount');
  const p = currentPrice();
  if(pv){
    const shown = Number(pv.textContent.replace(/[^0-9]/g,''));
    if(p !== shown){
      pv.innerHTML = `<span class="cur">RM</span> ${rm(p)}`;
      pv.classList.remove('bumped'); void pv.offsetWidth; pv.classList.add('bumped');
      updateSEO();
    }
  }
  if(bc) bc.textContent = bids.length;
  const sp = document.getElementById('stickyPrice'); if(sp) sp.innerHTML = `<small>RM</small> ${rm(p)}`;
  renderFeed(); renderBidStatus();
}

// ── GALLERY + FULL-SCREEN VIEWER ──
let lbEl = null;
function setPhoto(i){
  curPhoto = i;
  const nm = [auction.car_name, auction.year].filter(Boolean).join(' ');
  const m = document.getElementById('mainImg'); if(m){ m.src = photos[i]; m.alt = `${nm} photo ${i+1} of ${photos.length}`; }
  const g = document.getElementById('gcur'); if(g) g.textContent = i+1;
  const ts = document.querySelectorAll('.thumb');
  ts.forEach((t,ti)=>t.classList.toggle('active',ti===i));
  const box = document.getElementById('thumbs'), t = ts[i];
  if(box && t) box.scrollTo({left: t.offsetLeft - (box.clientWidth - t.clientWidth)/2, behavior:'smooth'});
  syncLightbox();
}
function prevPhoto(){ setPhoto((curPhoto-1+photos.length)%photos.length); }
function nextPhoto(){ setPhoto((curPhoto+1)%photos.length); }
function addSwipe(el){
  if(!el) return;
  let x0=null, y0=0;
  el.addEventListener('touchstart',e=>{ x0=e.touches[0].clientX; y0=e.touches[0].clientY; },{passive:true});
  el.addEventListener('touchend',e=>{
    if(x0===null || photos.length<2) return;
    const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0; x0=null;
    if(Math.abs(dx)>45 && Math.abs(dx)>Math.abs(dy)*1.5){ dx<0 ? nextPhoto() : prevPhoto(); }
  },{passive:true});
}
function openLightbox(){
  if(!lbEl){
    lbEl = document.createElement('div'); lbEl.className = 'lb';
    lbEl.innerHTML = '<img id="lbImg" alt=""><button class="lx" aria-label="Close" onclick="closeLightbox()">×</button><button class="lp" aria-label="Previous photo" onclick="prevPhoto()">‹</button><button class="ln" aria-label="Next photo" onclick="nextPhoto()">›</button><div class="lc" id="lbC"></div>';
    document.body.appendChild(lbEl);
    lbEl.addEventListener('click',e=>{ if(e.target===lbEl) closeLightbox(); });
    addSwipe(lbEl);
  }
  lbEl.classList.add('open'); document.body.style.overflow = 'hidden'; syncLightbox();
}
function syncLightbox(){
  if(!lbEl) return;
  document.getElementById('lbImg').src = photos[curPhoto];
  document.getElementById('lbC').textContent = (curPhoto+1)+' / '+photos.length;
  lbEl.querySelector('.lp').style.display = lbEl.querySelector('.ln').style.display = photos.length>1 ? 'flex' : 'none';
}
function closeLightbox(){ if(lbEl) lbEl.classList.remove('open'); document.body.style.overflow = ''; }
document.addEventListener('keydown',e=>{
  const open = lbEl && lbEl.classList.contains('open');
  if(e.key==='Escape'){ if(open) closeLightbox(); else closeModal(); }
  if(open && e.key==='ArrowRight') nextPhoto();
  if(open && e.key==='ArrowLeft') prevPhoto();
});

// ── TIMER ──
async function onAuctionEnded(){
  // Mark the page ended immediately; preserve prices if the final refresh fails.
  endedState=true;
  renderPage();
  await refreshAuction();
}
function startTimer(){
  if(timerInterval){ clearInterval(timerInterval); timerInterval=null; }
  if(isClosed()) return;
  if(!auction.deadline){
    const t=document.getElementById('timer'); if(t) t.textContent='Open for offers';
    const st=document.getElementById('stickyTime'); if(st) st.textContent='No closing deadline';
    return;
  }
  function tick(){
    const t=document.getElementById('timer'); if(!t) return;
    const diff=new Date(auction.deadline).getTime()-Date.now();
    if(diff<=0){ clearInterval(timerInterval); timerInterval=null; onAuctionEnded(); return; }
    const d=Math.floor(diff/86400000),h=Math.floor(diff/3600000)%24,m=Math.floor(diff/60000)%60,sec=Math.floor(diff/1000)%60;
    const seg=(n,l)=>`<div class="timer-seg"><div class="timer-num">${String(n).padStart(2,'0')}</div><div class="timer-lbl">${l}</div></div>`;
    t.innerHTML=(d>0?seg(d,'days'):'')+seg(h,'hrs')+seg(m,'min')+seg(sec,'sec');
    const st=document.getElementById('stickyTime'); if(st) st.textContent='Ends in '+(d>0?d+'d ':'')+h+'h '+m+'m';
  }
  timerInterval=setInterval(tick,1000);
  tick();
}

// ── BID MODAL: register → staff approval + deposit → bidder code → bid ──
const WA_NUMBER = '601151177026';
const TERMS_VERSION = '2026-11-offers-1';
let bidderCode = null, bidderInfo = null;
try { bidderCode = localStorage.getItem('kansaiBidderCode'); } catch(e){}

function setModal(html){ document.getElementById('modalInner').innerHTML = html; }
function modalErr(msg){ const e=document.getElementById('modalError'); if(!e) return; e.textContent=msg; e.style.display='block'; }
function closeModal(){ document.getElementById('bidModal').classList.remove('open'); }
function termsLinks(){ return '<a href="auction-terms.html" target="_blank" rel="noopener">Auction Terms</a>'; }
function waHref(text){ return 'https://wa.me/'+WA_NUMBER+'?text='+encodeURIComponent(text); }
function forgetBidder(){ bidderCode=null; bidderInfo=null; try{ localStorage.removeItem('kansaiBidderCode'); localStorage.removeItem('kansaiMyBids'); }catch(e){} renderBidStatus(); }

function registerHTML(){
  return `
    <div class="modal-title bebas">Register to Bid</div>
    <div class="modal-sub">One-time step, takes a minute</div>
    <div class="modal-note">To keep bidding fair, new bidders are approved by our team and place a refundable deposit before they can bid. We will contact you on WhatsApp.</div>
    <div class="modal-field"><label>Full Name</label><input type="text" id="regName" placeholder="Your name" autocomplete="name"></div>
    <div class="modal-field"><label>Mobile / WhatsApp Number</label><input type="tel" id="regPhone" placeholder="+60 1X-XXX XXXX" autocomplete="tel"></div>
    <label class="chk"><input type="checkbox" id="regAgree"><span>I agree to the ${termsLinks()} and the <a href="auction-privacy.html" target="_blank" rel="noopener">Privacy Notice</a>.</span></label>
    <div class="modal-error" id="modalError"></div>
    <div class="modal-actions"><button class="modal-cancel" onclick="closeModal()">Cancel</button><button class="modal-submit" id="regBtn" onclick="submitRegister()">Register</button></div>
    <div style="text-align:center;margin-top:6px"><button type="button" class="link-btn" onclick="showCodeScreen()">I already have a bidder code</button></div>`;
}
function codeHTML(){
  return `
    <div class="modal-title bebas">Enter Bidder Code</div>
    <div class="modal-sub">We send it to you on WhatsApp once you are approved</div>
    <div class="modal-field"><label>Bidder Code</label><input type="text" id="codeIn" class="code-in" placeholder="XXXX-XXXX" maxlength="9" autocomplete="off" autocapitalize="characters" spellcheck="false"></div>
    <div class="modal-error" id="modalError"></div>
    <div class="modal-actions"><button class="modal-cancel" onclick="closeModal()">Cancel</button><button class="modal-submit" id="codeBtn" onclick="submitCode()">Verify</button></div>
    <div style="text-align:center;margin-top:6px"><button type="button" class="link-btn" onclick="setModal(registerHTML())">Not registered yet? Register</button></div>`;
}
function pendingHTML(name, mode){
  const nm = [auction.car_name, auction.year].filter(Boolean).join(' ');
  const texts = {
    new: `Thank you${name?', '+esc(name):''}. You are registered. Our team will WhatsApp you to arrange the refundable deposit and approve your account. Once approved, you will receive a bidder code on WhatsApp. Enter it here to start bidding.`,
    existing_pending: 'This number is already registered and waiting for approval. Our team will contact you on WhatsApp to arrange the refundable deposit.',
    approved_existing: 'This number is already registered. Enter the bidder code we sent you on WhatsApp.',
    account_pending: `Your account is not ready to bid yet. It is waiting for approval and deposit confirmation. Our team will contact you on WhatsApp.`,
    blocked: 'This bidder account is not active. Please contact Kansai Group.'
  };
  return `
    <div class="modal-title bebas">${mode==='blocked'?'Account Not Active':(mode==='approved_existing'?'Already Registered':'Waiting for Approval')}</div>
    <div class="modal-sub" style="line-height:1.6">${texts[mode]||texts.new}</div>
    <a class="wa-btn" target="_blank" rel="noopener" onclick="kgTrack('whatsapp',auction.id)" href="${waHref('Hi Kansai Group, I registered to bid on the '+nm+'. Please confirm my deposit and approval.')}">WhatsApp Kansai Group</a>
    <div class="modal-actions">${mode==='blocked'?'':'<button class="modal-cancel" onclick="showCodeScreen()">I have my code</button>'}<button class="modal-submit" onclick="closeModal()">Close</button></div>`;
}
function bidFormHTML(){
  return `
    <div class="modal-title bebas">Submit an Offer</div>
    <div class="modal-sub" id="modalSub">Current bid: RM ${rm(currentPrice())}</div>
    <div class="known-bidder-bar"><div>Submitting as <strong>${esc(bidderInfo.name)}</strong></div><button type="button" onclick="notYou()">Not you?</button></div>
    <div class="modal-field">
      <label>Your Offer Amount (RM)</label>
      <input type="number" class="mono" id="bidAmount" placeholder="0" inputmode="numeric" oninput="onAmountEdit()">
      <div class="quick-bumps">
        <button type="button" onclick="bumpTo(1000)">+1,000</button>
        <button type="button" onclick="bumpTo(2000)">+2,000</button>
        <button type="button" onclick="bumpTo(5000)">+5,000</button>
      </div>
      <div class="modal-hint" id="bidHint"></div>
    </div>
    <div class="modal-error" id="modalError"></div>
    <div class="modal-actions"><button class="modal-cancel" onclick="closeModal()">Cancel</button><button class="modal-submit" id="submitBidBtn" onclick="submitBid()">Submit Offer</button></div>
    <div class="modal-consent">By bidding you agree to the ${termsLinks()}. A bid is an offer to purchase and cannot be withdrawn once placed.</div>`;
}

function showCodeScreen(){ setModal(codeHTML()); }
function notYou(){ forgetBidder(); showCodeScreen(); }
function showBidForm(){
  setModal(bidFormHTML());
  const price = currentPrice();
  document.getElementById('bidAmount').value = price + 1000;
  document.getElementById('bidHint').textContent = `Minimum bid RM ${rm(price+MIN_INCREMENT)}. Tap a button or type your amount.`;
}

async function verifyCode(code){
  try {
    const {data,error}=await sb.rpc('verify_bidder',{p_code:code});
    if(error || !data) return {ok:false,error:true};
    return data;
  } catch(error){ return {ok:false,error:true}; }
}

async function openModal(){
  if(!(await refreshAuction()) || isClosed()) return;
  kgTrack('bid_open', auction.id);
  document.getElementById('bidModal').classList.add('open');
  if(!bidderCode){ setModal(registerHTML()); return; }
  if(bidderInfo && bidderInfo.can_bid){ showBidForm(); return; }
  setModal('<div class="loading" style="padding:40px 10px">Checking your account…</div>');
  const r = await verifyCode(bidderCode);
  if(r.error){ setModal(`<div class="modal-title bebas">Connection Problem</div><div class="modal-sub">We could not check your account. Please check your connection and try again.</div><div class="modal-actions"><button class="modal-submit" onclick="closeModal()">Close</button></div>`); return; }
  if(!r.ok){ forgetBidder(); setModal(registerHTML()); modalErr('Your saved bidder code is no longer valid. Please register, or enter a new code.'); return; }
  bidderInfo = r;
  if(r.can_bid) showBidForm(); else setModal(pendingHTML(r.name, r.status==='blocked' ? 'blocked' : 'account_pending'));
}

async function submitRegister(){
  const name = document.getElementById('regName').value.trim();
  const phone = document.getElementById('regPhone').value.trim();
  if(!name){ modalErr('Please enter your name.'); return; }
  if(phone.replace(/[^0-9]/g,'').length < 9){ modalErr('Please enter a valid mobile number.'); return; }
  if(!document.getElementById('regAgree').checked){ modalErr('Please tick the box to agree to the Auction Terms and Privacy Notice.'); return; }
  const btn = document.getElementById('regBtn'); btn.textContent='Registering…'; btn.disabled=true;
  let data,error;
  try { ({data,error}=await sb.rpc('register_bidder',{p_name:name,p_phone:phone,p_terms:TERMS_VERSION})); }
  catch(e){ error=e; }
  if(error || !data){
    btn.textContent='Register'; btn.disabled=false;
    modalErr(error && error.code==='P0001' && error.message ? error.message : 'Could not register right now. Please try again.');
    return;
  }
  kgTrack('register_submit', auction.id);
  const mode = data.existing ? (data.status==='approved' ? 'approved_existing' : (data.status==='blocked' ? 'blocked' : 'existing_pending')) : 'new';
  setModal(pendingHTML(name, mode));
}

async function submitCode(){
  const code = document.getElementById('codeIn').value.trim().toUpperCase();
  if(code.length < 8){ modalErr('Please enter your full bidder code.'); return; }
  const btn = document.getElementById('codeBtn'); btn.textContent='Checking…'; btn.disabled=true;
  const r = await verifyCode(code);
  btn.textContent='Verify'; btn.disabled=false;
  if(r.error){ modalErr('Could not check the code. Please try again.'); return; }
  if(!r.ok){ modalErr('That code was not recognised. Please check it and try again.'); return; }
  bidderCode = code; bidderInfo = r;
  try { localStorage.setItem('kansaiBidderCode', code); } catch(e){}
  if(r.can_bid) showBidForm(); else setModal(pendingHTML(r.name, r.status==='blocked' ? 'blocked' : 'account_pending'));
}

function bumpTo(inc){
  const price = currentPrice();
  const cur = parseFloat(document.getElementById('bidAmount').value)||0;
  const newVal = (cur > price ? cur : price) + inc;
  document.getElementById('bidAmount').value = newVal;
  document.getElementById('bidHint').textContent = `Your bid: RM ${rm(newVal)} (RM ${rm(newVal-price)} above current)`;
}
function onAmountEdit(){
  const price = currentPrice();
  const v = parseFloat(document.getElementById('bidAmount').value)||0;
  document.getElementById('bidHint').textContent = v >= price+MIN_INCREMENT ? `RM ${rm(v-price)} above current bid` : `Minimum bid RM ${rm(price+MIN_INCREMENT)}`;
}

let submittingBid=false;
async function submitBid(){
  if(submittingBid) return;
  const amount=Number(document.getElementById('bidAmount').value);
  if(!Number.isFinite(amount) || amount<=0 || amount>100000000 || Math.round(amount*100)/100!==amount){
    modalErr('Enter a valid amount up to RM 100,000,000, with at most two decimal places.'); return;
  }
  const btn=document.getElementById('submitBidBtn');
  submittingBid=true; btn.textContent='Submitting…'; btn.disabled=true;
  try {
    if(!(await refreshAuction())){ modalErr('Could not verify the latest price. Please reconnect and try again.'); return; }
    if(isClosed()){ modalErr('This listing is closed to new offers.'); return; }
    const minimum=currentPrice()+MIN_INCREMENT;
    if(amount<minimum){ modalErr(`The latest minimum offer is RM ${rm(minimum)}. Please review your amount.`); return; }
    const {data,error}=await sb.rpc('place_bid',{p_auction:auction.id,p_amount:amount,p_code:bidderCode});
    if(error){
      modalErr(error.code==='P0001' ? error.message : 'We could not confirm your offer. Refresh and check the offer activity before trying again.');
      await refreshAuction(); return;
    }
    if(!data || data.ok!==true) throw new Error('No offer confirmation received.');
    kgTrack('bid_submit',auction.id);
    setModal(`<div class="modal-success"><div class="modal-title bebas">Offer Received</div><div class="modal-sub">Your offer of <strong>RM ${rm(amount)}</strong> has been received. It is subject to acceptance by Kansai Group. Our team will contact you if we accept it.</div><div class="modal-actions"><button class="modal-submit" onclick="closeModalAndRefresh()">Done</button></div></div>`);
    await refreshAuction();
  } catch(error){
    console.error(error);
    modalErr('We could not confirm your offer. Refresh and check the offer activity before trying again.');
  } finally {
    submittingBid=false;
    if(btn.isConnected){ btn.textContent='Submit Offer'; btn.disabled=false; }
  }
}

async function closeModalAndRefresh(){
  closeModal();
  await refreshAuction();
}

document.getElementById('bidModal').addEventListener('click',e=>{ if(e.target.id==='bidModal') closeModal(); });

loadAuction();
</script>
